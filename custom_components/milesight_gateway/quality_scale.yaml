rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration does not register custom actions.
  appropriate-polling:
    status: done
    comment: >-
      The coordinator polls the device list every 300 s by default, which
      suits how rarely it changes; sensor states arrive by MQTT push. The
      gateway status has its own interval, also 300 s by default, and the
      firmware check runs every 12 hours. The options flow exposes both
      intervals, minimum 60 s.
  brands:
    status: exempt
    comment: >-
      Custom integration: ships local brand images under brand/ as
      documented for custom integrations, which is what the HACS brands
      check validates. No home-assistant/brands pull request exists.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: Integration does not register custom actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment: >-
      No custom actions, but the entity actions of the control platforms send
      downlinks; a gateway that does not take one raises a translated
      HomeAssistantError and the entity keeps its previous state.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics:
    status: done
    comment: >-
      Options, matched models with their entity keys, and the gateway status.
      Credentials, addresses, serial numbers, EUIs and names are redacted.
  discovery-update-info:
    status: done
    comment: >-
      A discovered gateway is matched by its MAC, which is the entry's unique id
      and a device connection; a known gateway takes the new IP. An entry added
      by hand is matched by its address once and takes the MAC from then on.
  discovery:
    status: done
    comment: >-
      Milesight gateways are discovered by their 24:E1:24 MAC prefix over DHCP.
      The user confirms the model the gateway reports, then enters the login.
  docs-data-update: done
  docs-examples: todo
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: todo
  dynamic-devices: todo
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues: todo
  stale-devices: todo

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
